<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<style>
:root{--ink:#173039;--muted:#52656c;--line:#d9e2e3;--paper:#fff;--canvas:#f3f6f5;--accent:#11766e;--soft:#e8f3ef;--warn:#8a5415;--warn-bg:#fff4df;--dark:#142e36}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--canvas);color:var(--ink);font:16px/1.85 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overflow-wrap:anywhere}a{color:var(--accent);text-underline-offset:3px}a:hover{color:#064d49}a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.layout{max-width:1460px;margin:auto;display:grid;grid-template-columns:246px minmax(0,1fr);gap:40px;padding:34px 36px 60px}.sidebar{position:sticky;top:26px;align-self:start;max-height:calc(100vh - 52px);overflow-y:auto;padding:20px 12px 20px 2px}.brand{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--accent)}.side-title{font-size:23px;line-height:1.45;font-weight:750;margin:10px 0 24px}.sidebar nav a{display:block;border-left:2px solid var(--line);padding:7px 12px;text-decoration:none;color:var(--muted);font-size:14px;line-height:1.55}.sidebar nav a:hover{background:var(--soft);border-color:var(--accent)}.side-note{font-size:12px;color:var(--muted);margin-top:25px;padding-top:16px;border-top:1px solid var(--line)}main{min-width:0}.hero{background:var(--dark);color:#fff;border-radius:16px;padding:38px 42px;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#a7d7cf}.hero h1{font-size:34px;line-height:1.4;margin:15px 0 14px;letter-spacing:-.035em}.hero p{color:#d4e1e4}.hero .paper-title{font-size:16px;line-height:1.8}.hero a{color:#b4ebe2}.hero .meta-line{color:#c0d2d6;font-size:13px;margin-top:22px}.badge{display:inline-block;border-radius:20px;font-size:12px;line-height:1.6;padding:3px 10px;background:var(--soft);color:var(--accent);vertical-align:middle;font-weight:650}.badge.warn{color:var(--warn);background:var(--warn-bg)}.hero .badge{margin-bottom:12px}.section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 34px;margin:0 0 24px}.section h2{font-size:24px;line-height:1.5;letter-spacing:-.02em;margin:0 0 18px}.kicker{font-size:12px;letter-spacing:.11em;font-weight:700;color:var(--accent);margin-bottom:7px}.section h3{font-size:18px;line-height:1.6;margin:29px 0 12px;padding-top:14px;border-top:1px solid var(--line)}.section h3:first-child{margin-top:0}.section p{margin:10px 0 15px}.lead{font-size:17px;color:var(--muted)}.locator{font-size:12px;color:var(--muted);display:block;margin-top:5px}.refs{white-space:nowrap;font-size:12px;margin-left:4px}.refs a{margin-left:2px;text-decoration:none}.callout{border-left:4px solid var(--accent);background:var(--soft);padding:15px 19px;border-radius:0 8px 8px 0;margin:20px 0}.callout.warn{border-color:#b97b29;background:var(--warn-bg)}.callout strong{display:block;margin-bottom:4px}.callout p{margin:3px 0}.table-wrap{overflow-x:auto;width:100%;margin:14px 0 20px;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.75}th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:12px 14px;min-width:116px}th{background:#edf3f3;color:var(--ink);font-weight:700}tbody tr:last-child td{border-bottom:0}tbody tr:nth-child(even){background:#fafcfc}caption{text-align:left;padding:11px 14px;color:var(--muted);font-size:12px}.caption{font-size:13px;color:var(--muted);margin:9px 0 16px}.flow{list-style:none;display:flex;flex-wrap:wrap;gap:12px;padding:0;margin:17px 0}.flow li{flex:1 1 160px;border:1px solid var(--line);background:#f7faf9;border-top:3px solid var(--accent);padding:12px 15px;border-radius:7px;position:relative}.flow .step{display:block;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:5px}.flow .node-text{font-size:14px;line-height:1.7}.figure-image{margin:20px 0}.figure-image img{max-width:100%;height:auto;display:block;margin:auto;border:1px solid var(--line);border-radius:6px}.figure-image figcaption{font-size:12px;color:var(--muted);margin-top:9px}.math-block{padding:20px;background:#f8faf9;border-radius:8px;overflow-x:auto;text-align:center}math{font-size:1.4em;math-style:normal;font-family:"Cambria Math","STIX Math","Asana Math","DejaVu Math TeX Gyre",math,serif}details{margin:15px 0;border:1px solid var(--line);border-radius:7px;padding:10px 14px}summary{cursor:pointer;font-size:14px;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65;background:#f5f7f7;padding:15px;border-radius:5px}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.source-list{padding-left:26px}.source-list li{padding:8px 0 14px;border-bottom:1px solid var(--line)}.source-list .source-meta{font-size:12px;color:var(--muted)}.checks{padding-left:22px}.checks li{margin:8px 0}.report-footer{font-size:12px;color:var(--muted);text-align:center;padding:12px}.jump{font-size:12px;float:right}footer p{margin:4px 0}
@media(max-width:1000px){.layout{grid-template-columns:190px minmax(0,1fr);gap:22px;padding:24px 22px}.section{padding:25px 24px}.hero{padding:30px 28px}.hero h1{font-size:29px}}
@media(max-width:760px){.layout{display:block;padding:16px 12px 30px}.sidebar{position:static;max-height:none;padding:8px 5px 20px}.side-title{font-size:19px;margin:6px 0 12px}.sidebar nav{display:flex;flex-wrap:wrap;gap:6px}.sidebar nav a{border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;background:#fff}.side-note{display:none}.hero{padding:25px 22px;border-radius:11px}.hero h1{font-size:26px}.section{padding:24px 20px;border-radius:10px}.section h2{font-size:22px}.section h3{font-size:17px}.flow li{flex-basis:100%}.jump{float:none;display:block;margin-top:5px}}
@media print{body{background:#fff;font-size:11pt;color:#000}.layout{display:block;padding:0;max-width:none}.sidebar,.jump{display:none}.hero{background:#fff;color:#000;border-bottom:2px solid #333;border-radius:0;padding:0 0 18px}.hero p,.hero .meta-line,.eyebrow{color:#333}.section{border:0;border-bottom:1px solid #ccc;border-radius:0;padding:15px 0;margin:0}.section h2,.section h3{break-after:avoid}.callout,figure,tr,.flow li{break-inside:avoid}.table-wrap{overflow:visible}th,td{min-width:0;padding:6px}.source-list a{color:#000}.report-footer{margin-top:20px}details>pre{display:block}.flow{display:block}.flow li{margin-bottom:8px}a{text-decoration:none}}
</style>
