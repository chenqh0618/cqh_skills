interface:
  display_name: biomedical paper story reader
  short_description: 用“讲故事”的方式解读生物医学研究论文：先说明研究为什么值得做，再从全文中选择最能推动核心问题前进的3–5个关键证据节点，结合主图/关键子图讲清楚“问题→实验/分析→结果→新的认识→下一问”的递进关系。不追求覆盖全部图表或所有技术细节，但必须保留关键对照、证据边界和决定性负结果。默认中文，最终输出可独立阅读的HTML报告。适用于“沿主线讲这篇论文”“不要逐图罗列”“像讲故事一样解读论文”“抓住关键证据”等请求。
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
